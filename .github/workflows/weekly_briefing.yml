name: Weekly Briefing

on:
  # Railway 상시 서버 스케줄러(railway_server._scheduler)가 평일 16:10 KST 에 트리거.
  # 마감 시황(15:40)·수급 확정(16:00) 이후라 당일 데이터가 완결된 시점 — 그 주
  # 월요일~당일을 재합성해 같은 키(월요일 날짜)에 upsert (데일리 누적 주간 브리핑).
  workflow_dispatch: # 수동 실행 + Railway 스케줄러 트리거 진입점

concurrency:
  group: weekly-briefing
  cancel-in-progress: false

jobs:
  weekly-briefing:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the push-time rebase is clean

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'   # requirements-weekly.txt 키 — Install 단계 단축(2026-09-09)
          cache-dependency-path: .github/workflows/requirements-weekly.txt

      # 입력은 Railway 서버 HTTP 로 읽음(라이브 최신). yfinance 는 촉매 타임라인
      # 종목 '주간 누적' 등락률의 KIS 결손 폴백용(2026-09-09 KIS 우선 전환).
      - name: Install dependencies
        run: pip install -r .github/workflows/requirements-weekly.txt

      - name: Generate weekly briefing (모닝브리핑 + 장중 시황 주간 종합)
        timeout-minutes: 10
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          LLM_CHAIN:         ${{ vars.LLM_CHAIN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_weekly_briefing.py

      # 기준 템플릿(templates/weekly_briefing_template.xlsx — 사용자 확정 양식) 재현
      # 엑셀 생성. 검증 실패 시 커밋 안 되게 실패를 그대로 전파.
      - name: Build weekly briefing xlsx (template replication)
        run: python build_weekly_xlsx.py

      - name: Commit and push weekly briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # netbuy_rank·breadth 는 생성기가 함께 쓰는 당일 스냅샷 — add 에서 빠지면
          # unstaged 로 남아 push 경합 시 rebase 가 거부됨(2026-09-08 실측: "You have
          # unstaged changes" 5회 전패) + 스냅샷이 git 에 영속 안 돼 다음 날 누적 결손.
          git add public/weekly_briefing.json public/weekly_briefing.xlsx public/reports/weekly_briefing/ \
                  public/reports/netbuy_rank/ public/reports/breadth/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: weekly briefing $(date -u +'%Y-%m-%d %H:%MZ') [skip railway]"
          # 커밋 대상 외 잔여 변경이 남으면 rebase 가 거부됨 — 어떤 파일인지 로그로
          # 남기고(원인 추적), rebase 전에 stash 로 치운다(2026-09-08 실측 재발 방어).
          git status --porcelain | head -5
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push attempt $i rejected; rebasing onto latest main..."
            git fetch origin main
            git stash --include-untracked --quiet 2>/dev/null || true
            git rebase FETCH_HEAD || { git rebase --abort; echo "::error::rebase conflict"; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          echo "::error::push failed after 5 attempts" && exit 1

      # (2026-09 PG 마이그레이션) git 커밋과 병행해 Postgres 에도 업서트(dual-write).
      - name: Push reports to Postgres (dual-write)
        env:
          INGEST_TOKEN: ${{ secrets.REPORT_INGEST_TOKEN }}
        run: python push_reports_to_db.py || echo "::warning::DB ingest 실패 — git 커밋 폴백으로 동작"
