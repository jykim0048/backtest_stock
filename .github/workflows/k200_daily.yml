name: K200 Daily OHLCV

# KOSPI200 지수 일봉 수집(rwkv_ts_kospi200 논문 실험용 원천 데이터).
# 수동/온디맨드 실행 — 정기 스케줄 없음. 산출물 data/k200_daily.csv 를 레포에 커밋.
# push 트리거는 로컬에 gh CLI 가 없어 둔 것 — 수집 스크립트/워크플로 변경 푸시 = 재수집.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - fetch_k200_daily.py
      - .github/workflows/k200_daily.yml

concurrency:
  group: report-push
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch KOSPI200 daily OHLCV (naver fchart / m.stock fallback)
        run: python fetch_k200_daily.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/k200_daily.csv
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update k200_daily.csv $(date +'%Y-%m-%d') [skip railway]"
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push rejected; rebasing..."
            git fetch origin main
            git rebase FETCH_HEAD -X theirs || {
              git rebase --abort
              echo "::error::rebase conflict after -X theirs"
              exit 1
            }
            sleep $((RANDOM % 4 + 2))
          done
          echo "::error::push failed after 5 attempts" && exit 1
