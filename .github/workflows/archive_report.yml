name: Archive Daily Report on Push

on:
  push:
    branches: [main]
    paths: ['public/daily_market_report.json']

# Share the serialize group with the daily report so the two never race.
concurrency:
  group: report-push
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the push-time rebase is clean

      - name: Archive to dated file
        run: |
          python3 << 'EOF'
          import json, os, datetime, shutil
          kst = datetime.timezone(datetime.timedelta(hours=9))
          today = datetime.datetime.now(kst).strftime('%Y-%m-%d')
          os.makedirs('public/reports', exist_ok=True)
          shutil.copy('public/daily_market_report.json', f'public/reports/{today}.json')
          index_path = 'public/reports/index.json'
          index = json.load(open(index_path)) if os.path.exists(index_path) else []
          if today not in index:
              index.append(today)
              index.sort(reverse=True)
          with open(index_path, 'w', encoding='utf-8') as f:
              json.dump(index, f, ensure_ascii=False, indent=2)
          print(f'Archived: public/reports/{today}.json')
          EOF

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/reports/
          git diff --staged --quiet && exit 0
          git commit -m "chore: archive report $(TZ=Asia/Seoul date +'%Y-%m-%d') [skip railway]"
          # Remote may have advanced; push, and on rejection rebase and retry.
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push attempt $i rejected; rebasing onto latest main..."
            git fetch origin main
            git rebase FETCH_HEAD || { git rebase --abort; echo "::error::rebase conflict"; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          echo "::error::push failed after 5 attempts" && exit 1
