name: US Night SEC Catalysts

# 미국 프리~애프터마켓(KST 20:47~06:17) 동안 30분 간격 실행 — 유니버스(한국 연관
# 미국 종목 ~60티커)의 신규 8-K/6-K(원문 발췌 포함) + 시장 뉴스(지정학·매크로) 촉매를
# 수집·LLM 요약해 public/us_catalysts.json 에 세션 누적.
# 모닝브리프(07:43 daily_report)가 이 파일을 읽어 코멘트·촉매 테이블에 반영한다.
# 트리거 이중화(2026-07-24): Railway _scheduler dispatch(주) + GH cron(백스톱) —
# Railway 재배포·스레드 사망 시 dispatch 가 통째로 유실되던 단일 장애점 제거.
# 둘이 겹쳐도 concurrency 직렬화 + seen dedup 으로 무해(두 번째 회차는 신규 0건).
on:
  schedule:
    # UTC 11:17~21:47 = KST 20:17~06:47 발화, 실제 실행 여부는 guard(KST 20:30~06:30)가
    # 자름. GH cron 지연(수 분~십수 분)이 있어도 30분 그리드가 대부분 살아남는다.
    - cron: '17,47 11-21 * * 1-5'
  workflow_dispatch: # 수동 실행 + Railway 스케줄러 트리거 진입점
    inputs:
      force:
        description: "시간 게이트 무시(테스트용)"
        required: false
        default: "false"

concurrency:
  group: usnight-push
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        # 지연 트리거가 엉뚱한 시간에 돌지 않게 KST 20:30~06:30 밖이면 스킵
        # (프리마켓 19시대 실적은 다음 세션 시작 전 20:47 첫 회차가 흡수).
        # force dispatch 는 테스트용이라 항상 통과. schedule 이벤트는 inputs 가
        # 비어 있어 자연히 시간 게이트를 탄다.
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force=true — bypassing time gate (manual test)"
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NOW=$(( 10#$(TZ=Asia/Seoul date +%H) * 60 + 10#$(TZ=Asia/Seoul date +%M) ))
          HM=$(TZ=Asia/Seoul date +%H:%M)
          if [ "$NOW" -ge 1230 ] || [ "$NOW" -le 390 ]; then
            echo "KST $HM — US pre~after market window; proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "KST $HM — outside US session window; skipping"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # edgartools 는 이 워크플로에서만 설치 — pyarrow 등 무거운 의존성과 pandas
      # 버전 드리프트가 다른 워크플로(공용 requirements.txt)로 번지지 않게 격리.
      - name: Install dependencies
        run: pip install -r requirements.txt edgartools

      - name: Collect US SEC catalysts
        env:
          # vars 미설정이면 빈 문자열이 넘어가므로 워크플로 차원에서도 기본값 보장.
          # 개인 이메일은 코드에 두지 않는다(public 레포) — 실 연락처는 vars 로 설정.
          SEC_IDENTITY:      ${{ vars.SEC_IDENTITY || 'QuantAntigravity jykim0048@users.noreply.github.com' }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          LLM_CHAIN:         ${{ vars.LLM_CHAIN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 뉴스 레그(지정학·매크로 촉매) — 없으면 해당 소스만 조용히 생략
          TAVILY_API_KEY:      ${{ secrets.TAVILY_API_KEY }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python generate_us_catalysts.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 파일 부재(수집 스킵 회차)면 fatal 로 죽던 결함(2026-07-23) — 관용 처리
          git add public/us_catalysts.json 2>/dev/null || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: US SEC catalysts $(date -u +'%Y-%m-%d %H:%MZ') [skip railway]"
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push attempt $i rejected; rebasing..."
            git fetch origin main
            git rebase FETCH_HEAD || { git rebase --abort; echo "::error::rebase conflict"; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          echo "::error::push failed after 5 attempts" && exit 1
