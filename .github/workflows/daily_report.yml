name: Daily Market Report

on:
  schedule:
    # 08:30 KST = 23:30 UTC (the PREVIOUS calendar day). Runs Mon–Fri.
    # KST 기준 당일 장전이나, 전 거래일 종가 데이터를 사용하도록 코드가 조정되어 있음.
    - cron: '30 23 * * 0-4'
  workflow_dispatch: # allow manual trigger for testing

# Serialize report-writing workflows so they never race each other on push.
concurrency:
  group: report-push
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the push-time rebase is clean

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Screen surge candidates (pre-market selection)
        continue-on-error: true   # best-effort; on total failure keep the previous watchlist
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          LLM_CHAIN:           ${{ vars.LLM_CHAIN }}   # optional override; empty = default chain
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY:        ${{ secrets.DART_API_KEY }}
          TAVILY_API_KEY:      ${{ secrets.TAVILY_API_KEY }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python screener.py

      - name: Generate daily report
        run: python generate_report.py

      - name: Generate deep research analysis
        continue-on-error: true   # best-effort; never block the price report
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          LLM_CHAIN:           ${{ vars.LLM_CHAIN }}   # optional override; empty = default chain
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY:        ${{ secrets.DART_API_KEY }}
          TAVILY_API_KEY:      ${{ secrets.TAVILY_API_KEY }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python generate_analysis.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist.json public/daily_market_report.json public/reports/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: auto-generate daily market report $(date +'%Y-%m-%d')"
          # Remote may have advanced (manual or concurrent pushes); push, and on
          # rejection rebase onto the latest main and retry.
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push attempt $i rejected; rebasing onto latest main..."
            git fetch origin main
            git rebase FETCH_HEAD || { git rebase --abort; echo "::error::rebase conflict"; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          echo "::error::push failed after 5 attempts" && exit 1
