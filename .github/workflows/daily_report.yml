name: Daily Market Report

on:
  schedule:
    # 08:00 KST = 23:00 UTC (previous day). Runs Mon–Fri.
    - cron: '0 23 * * 0-4'
  workflow_dispatch: # allow manual trigger for testing

jobs:
  generate-report:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily report
        run: python generate_report.py

      - name: Generate deep research analysis
        continue-on-error: true   # best-effort; never block the price report
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY:        ${{ secrets.DART_API_KEY }}
          TAVILY_API_KEY:      ${{ secrets.TAVILY_API_KEY }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python generate_analysis.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/daily_market_report.json public/reports/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: auto-generate daily market report $(date +'%Y-%m-%d')"
          git push
