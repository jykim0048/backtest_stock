name: Intraday Watchlist Screener

on:
  # 정기 실행은 Railway 상시 서버 스케줄러(railway_server._scheduler)가 평일 09:07~14:37 KST,
  # 30분 간격(:07/:37)으로 workflow_dispatch 로 트리거한다. GitHub 자체 schedule 은 지연·드롭이
  # 잦아 제거했다(아래 guard job 은 비정상 트리거 대비 안전망으로 유지).
  workflow_dispatch: # 수동 실행 + Railway 스케줄러 트리거 진입점

# 장중 관심종목은 자체 그룹으로 직렬화한다. 장전(daily_report)·아카이브와 group 을 공유하면
# 장중 시간대에 그들이 그룹을 점유할 때 장중 schedule 이 대기하다 다음 트리거에 밀려 취소된다.
# main push 동시성은 각 워크플로의 push 단계에 있는 fetch+rebase 재시도가 처리한다.
concurrency:
  group: intraday-push
  cancel-in-progress: false

jobs:
  # GitHub Actions schedule 은 혼잡 시간대에 수십 분~수 시간 지연·이월된다. cron 을
  # 09:07~14:37(KST)로 좁혀도 지연 트리거가 KST 18시대(장 마감 후)에 실행되는 일이 잦다.
  # 그래서 실제 실행 시점의 KST 가 장중(09:00~15:00 평일)이 아니면 본 작업을 스킵한다.
  # 수동 workflow_dispatch 는 테스트용이라 항상 통과시킨다.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        name: Run only during KST market hours (defend against delayed schedule)
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "event=${{ github.event_name }} (manual) — proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NOW=$(( 10#$(TZ=Asia/Seoul date +%H) * 60 + 10#$(TZ=Asia/Seoul date +%M) ))
          DOW=$(TZ=Asia/Seoul date +%u)   # 1=Mon … 7=Sun
          HM=$(TZ=Asia/Seoul date +%H:%M)
          # 장중 회차는 09:07~14:37(KST). 정상 지연 여유를 둬 09:00~15:00(540~900분) 평일만 허용.
          if [ "$DOW" -le 5 ] && [ "$NOW" -ge 540 ] && [ "$NOW" -le 900 ]; then
            echo "KST $HM (min=$NOW dow=$DOW) — within market hours; proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "KST $HM (min=$NOW dow=$DOW) — outside market hours; skipping (delayed schedule)"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  intraday-screen:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # 장중 관심종목 수 (장전 워치리스트 10개보다 적게). 필요시 repo Variable로 조정.
      SCREEN_N_FINAL: '6'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the push-time rebase is clean

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Screen intraday surge candidates
        continue-on-error: true   # best-effort; on failure keep the previous intraday list
        env:
          SCREEN_MODE:         intraday
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          LLM_CHAIN:           ${{ vars.LLM_CHAIN }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY:        ${{ secrets.DART_API_KEY }}
          TAVILY_API_KEY:      ${{ secrets.TAVILY_API_KEY }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python screener.py

      - name: Generate intraday price-level report
        env:
          REPORT_WATCHLIST:      intraday_watchlist.json
          REPORT_OUT:            public/intraday_report.json
          REPORT_ARCHIVE:        '1'                    # 날짜별 아카이브(나중에 과거 조회)
          REPORT_ARCHIVE_DIR:    public/reports/intraday   # 장전(reports/)과 분리된 장중 전용
          REPORT_CARRY_ANALYSIS: '1'                    # 직전 리포트 deep-research 이월(증분 분석)
        run: python generate_report.py

      - name: Generate intraday deep research analysis
        continue-on-error: true   # best-effort; never block the price report
        env:
          ANALYSIS_WATCHLIST:    intraday_watchlist.json
          ANALYSIS_REPORT:       public/intraday_report.json
          ANALYSIS_ARCHIVE:      '0'
          ANALYSIS_INCREMENTAL:  '1'    # 신규/TTL/가격급변/신규공시만 재분석(LLM 비용 절감)
          ANALYSIS_TTL_HOURS:    '2'    # 이월 분석 유효시간(경과 시 1회 새로고침)
          ANALYSIS_PRICE_MOVE_PCT: '5'  # 분석 시점 대비 가격 급변 임계(재분석 트리거)
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          LLM_CHAIN:           ${{ vars.LLM_CHAIN }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY:        ${{ secrets.DART_API_KEY }}
          TAVILY_API_KEY:      ${{ secrets.TAVILY_API_KEY }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python generate_analysis.py

      - name: Commit and push intraday report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add intraday_watchlist.json public/intraday_report.json public/reports/intraday/ public/reports/selection/intraday/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: auto-generate intraday watchlist $(date -u +'%Y-%m-%d %H:%MZ') [skip railway]"
          # Remote may have advanced (daily report or concurrent pushes); push, and
          # on rejection rebase onto the latest main and retry.
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push attempt $i rejected; rebasing onto latest main..."
            git fetch origin main
            git rebase FETCH_HEAD || { git rebase --abort; echo "::error::rebase conflict"; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          echo "::error::push failed after 5 attempts" && exit 1
