name: Intraday Watchlist Screener

on:
  # 정기 실행은 Railway 상시 서버 스케줄러(railway_server._scheduler)가 평일 09:07~15:07 KST,
  # 30분 간격(:07/:37, 마지막 15:07 은 최종 가집계 14:30±10분 포착용)으로 workflow_dispatch
  # 트리거한다. GitHub 자체 schedule 은 지연·드롭이 잦아 제거했다(guard 는 안전망으로 유지).
  workflow_dispatch: # 수동 실행 + Railway 스케줄러 트리거 진입점

# 장중 관심종목은 자체 그룹으로 직렬화한다. 장전(daily_report)·아카이브와 group 을 공유하면
# 장중 시간대에 그들이 그룹을 점유할 때 장중 schedule 이 대기하다 다음 트리거에 밀려 취소된다.
# main push 동시성은 각 워크플로의 push 단계에 있는 fetch+rebase 재시도가 처리한다.
concurrency:
  group: intraday-push
  cancel-in-progress: false

jobs:
  intraday-screen:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # 장중 관심종목 1회차 최대 선정 수. 필요시 repo Variable로 조정.
      SCREEN_N_FINAL: '10'

    steps:
      # (구 guard job 인라인, 2026-07-27) 별도 job 이던 KST 장중 가드는 workflow_dispatch
      # 전용이 된 지금 항상 통과하는 no-op 인데, 러너 스핀업+잡 핸드오프로 회차마다
      # ~20-45초를 낭비해 같은 job 의 첫 스텝으로 이동했다. schedule: 재도입 시 방어는
      # 유지 — GitHub schedule 은 혼잡 시간대 수십 분~수 시간 지연·이월되므로(KST 18시대
      # 실행 사례) 지연 발화가 장외(평일 09:00~15:00 밖)면 여기서 job 을 중단한다.
      - name: Guard — KST market hours (schedule 지연 발화 방어)
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "event=${{ github.event_name }} (dispatch/manual) — proceeding"
            exit 0
          fi
          NOW=$(( 10#$(TZ=Asia/Seoul date +%H) * 60 + 10#$(TZ=Asia/Seoul date +%M) ))
          DOW=$(TZ=Asia/Seoul date +%u)   # 1=Mon … 7=Sun
          HM=$(TZ=Asia/Seoul date +%H:%M)
          # 장중 회차는 09:07~14:37(KST). 정상 지연 여유를 둬 09:00~15:00(540~900분) 평일만 허용.
          if [ "$DOW" -le 5 ] && [ "$NOW" -ge 540 ] && [ "$NOW" -le 900 ]; then
            echo "KST $HM (min=$NOW dow=$DOW) — within market hours; proceeding"
          else
            echo "::warning::KST $HM (min=$NOW dow=$DOW) — outside market hours; aborting delayed schedule run"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the push-time rebase is clean

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Screen intraday surge candidates
        continue-on-error: true   # best-effort; on failure keep the previous intraday list
        env:
          SCREEN_MODE:         intraday
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          LLM_CHAIN:           ${{ vars.LLM_CHAIN }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY:        ${{ secrets.DART_API_KEY }}
          TAVILY_API_KEY:      ${{ secrets.TAVILY_API_KEY }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python screener.py; rc=$?
          echo "[timing] screener ${SECONDS}s rc=$rc"
          exit $rc

      # 시황 브랜치(경제·실적 캘린더 → 장중 시황)를 여기서 백그라운드로 띄운다.
      # 반드시 screener 뒤: screener 는 '직전 회차' intraday_briefing.json 을 시드로 읽으므로
      # (screener.py:637 briefing_catalyst_candidates), 그 전에 시황을 재생성하면 같은 회차
      # read/write 레이스가 난다. 리포트·분석·수급 스텝은 econ/earnings/briefing 파일을
      # 건드리지 않으므로(검증 완료) 이 브랜치와 완전 독립 — 15분짜리 시황을 크리티컬
      # 패스에서 빼 아래 브랜치 A 와 병렬로 돌린다. 커밋 전 'Join' 스텝에서 마커로 합류.
      - name: Start briefing branch in background (경제·실적 캘린더 + 장중 시황)
        continue-on-error: true
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          LLM_CHAIN:           ${{ vars.LLM_CHAIN }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY:        ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY:      ${{ secrets.DATA_GO_KR_KEY }}   # 관세청 수출입 통계(발표일만 호출)
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # LLM 워스트케이스 꼬리 캡(시황 전용): 브리핑엔 _mechanical_briefing 폴백이 있어
          # 빨리 실패해도 산출물이 보장된다 — 요청 타임아웃 120→75s, 폴백 체인 5→3링크.
          # 브랜치 A(딥리서치)는 폴백 산출물이 없으므로 기본값(120s/전체 체인) 유지.
          LLM_TIMEOUT_S:       '75'
          LLM_MAX_LINKS:       '3'
        run: |
          rm -f briefing_branch.done briefing_branch.log
          # nohup+백그라운드로 스텝(shell) 종료 후에도 살아남게 한다. env 는 fork 시점에
          # 상속되므로 위 env 블록이 그대로 전파된다. 각 스크립트는 best-effort — 하나가
          # 실패/타임아웃해도 다음으로 진행하고, 끝에서 항상 done 마커를 남긴다(원래 각
          # 스텝의 continue-on-error 의미 유지). 시황엔 원래 timeout-minutes:15 가 있었으므로
          # timeout 720s(12분)로 무한 대기 방어.
          nohup bash -c '
            set +e
            t0=$SECONDS
            timeout 180 python fetch_econ_calendar.py    ; rc=$?; echo "[branchB][timing] econ rc=$rc $((SECONDS-t0))s"
            t0=$SECONDS
            timeout 180 python fetch_earnings_calendar.py ; rc=$?; echo "[branchB][timing] earnings rc=$rc $((SECONDS-t0))s"
            t0=$SECONDS
            timeout 720 python generate_intraday_briefing.py ; rc=$?; echo "[branchB][timing] briefing rc=$rc $((SECONDS-t0))s"
            echo "[branchB][timing] total ${SECONDS}s"
            echo done > briefing_branch.done
          ' > briefing_branch.log 2>&1 &
          echo "briefing branch launched (pid=$!)"

      - name: Generate intraday price-level report
        env:
          REPORT_WATCHLIST:      intraday_watchlist.json
          REPORT_OUT:            public/intraday_report.json
          REPORT_ARCHIVE:        '1'                    # 날짜별 아카이브(나중에 과거 조회)
          REPORT_ARCHIVE_DIR:    public/reports/intraday   # 장전(reports/)과 분리된 장중 전용
          REPORT_CARRY_ANALYSIS: '1'                    # 직전 리포트 deep-research 이월(증분 분석)
        run: |
          python generate_report.py; rc=$?
          echo "[timing] report ${SECONDS}s rc=$rc"
          exit $rc

      - name: Generate intraday down-watch report (하락 관찰, 참고용)
        continue-on-error: true   # best-effort; 하락 리스트 없으면 빈 리포트
        env:
          REPORT_WATCHLIST:      intraday_watchlist_down.json
          REPORT_OUT:            public/intraday_down_report.json
          REPORT_ARCHIVE:        '1'
          REPORT_ARCHIVE_DIR:    public/reports/intraday_down   # 과거 날짜 조회용(상승과 분리)
          REPORT_SIDE:           down
          REPORT_CARRY_ANALYSIS: '1'   # 직전 deep-research 이월(증분 분석 + 아카이브에 분석 반영)
        run: |
          python generate_report.py; rc=$?
          echo "[timing] report-down ${SECONDS}s rc=$rc"
          exit $rc

      - name: Generate intraday deep research analysis
        continue-on-error: true   # best-effort; never block the price report
        env:
          ANALYSIS_WATCHLIST:    intraday_watchlist.json
          ANALYSIS_REPORT:       public/intraday_report.json
          ANALYSIS_ARCHIVE:      '0'
          ANALYSIS_INCREMENTAL:  '1'    # 신규/TTL/가격급변/신규공시만 재분석(LLM 비용 절감)
          ANALYSIS_TTL_HOURS:    '2'    # 이월 분석 유효시간(경과 시 1회 새로고침)
          ANALYSIS_PRICE_MOVE_PCT: '5'  # 분석 시점 대비 가격 급변 임계(재분석 트리거)
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          LLM_CHAIN:           ${{ vars.LLM_CHAIN }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY:        ${{ secrets.DART_API_KEY }}
          TAVILY_API_KEY:      ${{ secrets.TAVILY_API_KEY }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python generate_analysis.py; rc=$?
          echo "[timing] analysis ${SECONDS}s rc=$rc"
          exit $rc

      - name: Generate intraday down-watch deep research (하락 관찰 딥리서치)
        continue-on-error: true   # best-effort; 하락 리스트가 비면 no-op
        env:
          ANALYSIS_WATCHLIST:    intraday_watchlist_down.json
          ANALYSIS_REPORT:       public/intraday_down_report.json
          ANALYSIS_ARCHIVE:      '0'   # 상승과 동일 — 아카이브는 다음 회차 carry-over 로 반영
          ANALYSIS_INCREMENTAL:  '1'   # 신규/TTL/가격급변/신규공시만 재분석(LLM 비용 절감)
          ANALYSIS_TTL_HOURS:    '2'
          ANALYSIS_PRICE_MOVE_PCT: '5'
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          LLM_CHAIN:           ${{ vars.LLM_CHAIN }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY:        ${{ secrets.DART_API_KEY }}
          TAVILY_API_KEY:      ${{ secrets.TAVILY_API_KEY }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python generate_analysis.py; rc=$?
          echo "[timing] analysis-down ${SECONDS}s rc=$rc"
          exit $rc

      # 수급(flow)만 회차마다 풀 갱신 — LLM 재분석 없이 장전 워치리스트·장중 관심종목·
      # 하락 관찰 리포트의 analysis.flow 를 KIS 허브(/flow)+네이버 trend 최신값으로 교체.
      # flowComment 등 딥리서치 본문은 이월(비용 0). 딥리서치 스텝 뒤에 둬서 방금
      # 재분석된 종목도 같은 회차 기준 수급으로 통일된다.
      - name: Refresh investor flow only (수급 갱신 — LLM 미사용)
        continue-on-error: true   # best-effort; 실패 시 기존 수급 유지
        run: |
          python refresh_flow.py; rc=$?
          echo "[timing] flow ${SECONDS}s rc=$rc"
          exit $rc

      # 시황 브랜치 합류: 위에서 백그라운드로 띄운 경제·실적 캘린더+시황이 끝날 때까지
      # (done 마커) 대기 후 로그를 출력한다. 브랜치 A(리포트·분석·수급)가 도는 동안 시황이
      # 병렬로 진행됐으므로 보통 이미 완료돼 즉시 통과한다. best-effort — 상한(≈13분) 내
      # 미완이면 경고만 남기고 커밋으로 진행(기존 continue-on-error 의미 유지).
      - name: Join briefing branch (시황 브랜치 합류)
        continue-on-error: true
        run: |
          for i in $(seq 1 390); do   # 390 x 2s = 780s(13분) 상한
            [ -f briefing_branch.done ] && break
            sleep 2
          done
          echo "[timing] join waited ${SECONDS}s"   # 브랜치 A 가 시황을 기다린 실제 시간
          echo "--- briefing branch log ---"
          cat briefing_branch.log 2>/dev/null || true
          if [ -f briefing_branch.done ]; then
            echo "briefing branch finished"
          else
            echo "::warning::briefing branch did not finish within 13min — proceeding (best-effort)"
          fi

      - name: Commit and push intraday report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add intraday_watchlist.json public/intraday_report.json public/reports/intraday/ public/reports/selection/intraday/
          # 수급 갱신(refresh_flow.py)이 장전 워치리스트 리포트의 flow 도 최신화한다
          git add public/daily_market_report.json 2>/dev/null || true
          # 하락 관찰 산출물 — 생성 실패 등으로 파일이 없으면 조용히 무시
          git add intraday_watchlist_down.json public/intraday_down_report.json public/reports/intraday_down/ 2>/dev/null || true
          # 장중 시황 산출물 — 생성 실패 시 파일이 없으면 조용히 무시
          git add public/intraday_briefing.json public/reports/intraday_briefing/ public/econ_calendar.json 2>/dev/null || true
          git add public/earnings_calendar.json 2>/dev/null || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: auto-generate intraday watchlist $(date -u +'%Y-%m-%d %H:%MZ') [skip railway]"
          # Remote may have advanced (daily report or concurrent pushes); push, and
          # on rejection rebase onto the latest main and retry.
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push attempt $i rejected; rebasing onto latest main..."
            git fetch origin main
            git rebase FETCH_HEAD || { git rebase --abort; echo "::error::rebase conflict"; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          echo "::error::push failed after 5 attempts" && exit 1
