name: Investment Warning Update

on:
  workflow_dispatch:
  # 07:50 KST (= UTC 22:50 전날) 평일 실행. 장전에 미리 갱신.
  # 1~3h 지연 허용 — 일간 데이터라 정확한 시각이 불필요.
  schedule:
    - cron: '50 22 * * 0-4'  # UTC Sun-Thu 22:50 = KST Mon-Fri 07:50

concurrency:
  group: report-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 openpyxl

      - name: Fetch investment warning/caution data from KIND
        env:
          DEBUG_KIND: "1"
        run: python fetch_investment_warning.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/investment_warning.json public/reports/invwarn/ public/data/debug_kind_*.txt 2>/dev/null || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update investment warning list $(date +'%Y-%m-%d')"
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push rejected; rebasing..."
            git fetch origin main
            # 충돌 시 우리가 생성한 파일(JSON/디버그)을 우선 적용
            git rebase FETCH_HEAD -X theirs || {
              git rebase --abort
              echo "::error::rebase conflict after -X theirs"
              exit 1
            }
            sleep $((RANDOM % 4 + 2))
          done
          echo "::error::push failed after 5 attempts" && exit 1
