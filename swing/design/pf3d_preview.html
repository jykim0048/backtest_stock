<body>
<div class="pv-wrap">
  <div class="pv-note" id="pv-note">
    <b>시안</b> — 종목을 눌렀을 때 뜨는 판단 팝업은 <b>기존 그대로</b>이고, 새로 들어가는 것은 트레이딩 히스토리 카드 위의
    <span class="new">당일 등락 요인 분해</span> 카드 하나입니다. 팝업의 값·PM 요약·히스토리·리포트 = swing-web 실제 데이터,
    요인 16개 = 11/10 재판별 리포트에서 <b>손으로 추린 예시</b>(요인을 뽑는 단계는 아직 없음).
  </div>
  <dialog id="decision" open>
    <form method="dialog" class="dlg-head" onsubmit="return false"><h2 id="dec-title">불러오는 중…</h2><button aria-label="닫기">✕</button></form>
    <div id="dec-body"></div>
  </dialog>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {

    function ballNode(kind, pos, r, color, html, cls, extra) {

    }

      m.position.copy(pos); m.renderOrder = 2; world.add(m);
      var back = new T.Mesh(new T.SphereGeometry(R * 1.015, 44, 30), new T.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.2, side: T.BackSide, depthWrite: false }));

    function orbitPos(o) { return new T.Vector3(Math.cos(o.a) * o.R, 0, Math.sin(o.a) * o.R).applyQuaternion(o.q); }

    }
    function load(model) {

      var G = model.groups;

      ballNode("root", new T.Vector3(), 0.9, 0x06b6d4, esc(model.root.name) + model.root.valueHtml, "root");

        var pts = []; for (var a = 0; a <= 96; a++) pts.push(new T.Vector3(Math.cos(a / 96 * Math.PI * 2) * orbit.R, 0, Math.sin(a / 96 * Math.PI * 2) * orbit.R).applyQuaternion(orbit.q));

    var btnRot = stage.querySelector('[data-a="rot"]');
    function setAuto(x) { auto = x; btnRot.textContent = x ? "⏸ 공전 멈춤" : "▶ 공전"; }

    stage.addEventListener("pointerleave", function () { hovered = null; stage.style.cursor = ""; });

    if (lr && lr.summary) summ = '<div class="dec-sec"><h4>PM 요약 <span class="muted">· 최근 재판별 ' + esc(lr.date.slice(5)) + "</span> " + rating(lr.rating) + '</h4><div class="report">' + esc(lr.summary) + "</div>" +
      (d.summary ? '<details class="dec-first"><summary>최초 진입 판단 요약 · ' + esc((d.date || "").slice(5)) + '</summary><div class="report">' + esc(d.summary) + "</div></details>" : "") + "</div>";
    else if (d.summary) summ = '<div class="dec-sec"><h4>PM 요약</h4><div class="report">' + esc(d.summary) + "</div></div>";
    // ▼ 맨 위 한 줄: 왼쪽 = PM 등급~비중 카드 3×2(+ PM 요약), 오른쪽 = 당일 등락 요인 분해 카드
    MOVE = todayMove(h) || { date: "2026-11-11", ts: "15:34", price: 389500, prevClose: 400000, rate: -2.63 };
    var pf3d = '<div class="dec-sec" id="dec-pf3d"><div class="pf3d-card"><div class="pf3d-top"><strong>당일 등락 요인 분해</strong>' +
      '<span class="basis">' + esc(MOVE.date.slice(5).replace("-", "/")) + (MOVE.ts ? " " + esc(MOVE.ts) : "") + ' 기준 <b class="' + sgn(MOVE.rate) + '">' + pctTxt(MOVE.rate) + "</b> · " + won(MOVE.prevClose) + " → " + won(MOVE.price) + "</span>" +
      '<span class="pf3d-est">추정</span><em id="pf3d-fold">접기 ▴</em></div>' +
      '<div class="o3-stage" id="pf3d-stage"><canvas></canvas><div class="o3-labels"></div>' +
      '<div class="o3-tools"><button type="button" class="o3-tool" data-a="rot">⏸ 공전 멈춤</button><button type="button" class="o3-tool" data-a="reset">⟲ 처음 시점</button></div>' +
      '<div class="o3-info" style="display:none"></div><div class="o3-hint">큰 구 = 리포트 항목, 안의 공 = 요인(클수록 영향 큼) · 끌어서 회전 · 눌러서 자세히</div></div>' +
      '<div class="pf3d-foot" id="pf3d-foot"></div></div></div>';
    var html = '<div class="dec-top"><div class="dec-left">' + grid + summ + '</div>' + pf3d + "</div>";
    html += '<div class="dec-sec" id="dec-hist">' + histCard(h) + "</div>";
    var reps = d.reports || {};
    var groups = ROLE_GROUPS.map(function (x) { return [x[0], x[1].filter(function (r) { return reps[r[0]]; })]; }).filter(function (x) { return x[1].length; });
    if (groups.length) html += '<div class="dec-sec"><h4>종합 리포트</h4>' + groups.map(function (x) {
      var rep = function (k) { return '<div class="report md">' + (k === "peers" ? '<pre style="white-space:pre-wrap;font-size:11.5px">' + esc(reps[k]) + "</pre>" : md(reps[k])) + "</div>"; };
      var body = x[1].length === 1 ? rep(x[1][0][0]) : '<div class="role-list">' + x[1].map(function (r) { return '<details data-role="' + r[0] + '"><summary>' + esc(r[1]) + "</summary>" + rep(r[0]) + "</details>"; }).join("") + "</div>";
      return '<details class="stage"><summary>' + esc(x[0]) + (x[1].length > 1 ? ' <span class="muted">' + x[1].length + "</span>" : "") + "</summary>" + body + "</details>";
    }).join("") + "</div>";
    html += '<p class="muted" style="font-size:11px;margin-top:14px">판단 엔진 ' + esc(d.agent || "—") + "</p>";
    $("dec-body").innerHTML = html;
    var ok = !!window.THREE; if (ok) { try { var tc = document.createElement("canvas"); ok = !!(tc.getContext("webgl") || tc.getContext("experimental-webgl")); } catch (e) { ok = false; } }
    if (!ok) { $("dec-pf3d").hidden = true; return; }     // 3D 를 못 그리면 카드만 숨김 — 팝업은 그대로
    var model = pfModel(MOVE.rate);
    $("pf3d-foot").textContent = "요인 " + model.n + "개 · 리포트의 요인 강도(1~5)를 당일 등락률에 맞춰 %p 로 나눈 추정치 — 빨강 = 주가를 올린 요인, 파랑 = 내린 요인" + (sh ? " (Short 포지션에는 반대로 작용)" : "");
    orb = Orb3D($("pf3d-stage"), { onPick: function (cat) {     // 항목·요인을 누르면 종합 리포트의 그 항목을 연다
      var el = document.querySelector('#dec-body details[data-role="' + cat + '"]'); if (!el) return;
      Array.prototype.forEach.call(document.querySelectorAll("#dec-body details[data-role]"), function (x) { x.open = x === el; });
      el.closest("details.stage").open = true;
    } });
    orb.load(model);
    $("pf3d-fold").onclick = function () { var st = $("pf3d-stage"), hid = st.style.display !== "none"; st.style.display = hid ? "none" : ""; $("pf3d-foot").style.display = hid ? "none" : ""; this.textContent = hid ? "펼치기 ▾" : "접기 ▴"; };
  }
  function get(p) { return fetch(API + p).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  Promise.all([get("/api/swing/decision?key=" + encodeURIComponent(KEY)), get("/api/swing/history?key=" + encodeURIComponent(KEY)).catch(function () { return null; })])
    .then(function (r) { render(r[0], r[1]); })
    .catch(function (e) { $("dec-title").textContent = "판단 원문을 불러오지 못했습니다(" + e.message + ")"; });
  window.__sw = { state: function () { return orb && orb.state(); }, focus: function (id) { orb.focus(id); }, move: function () { return MOVE; }, model: function () { return pfModel(MOVE.rate); } };
})();
